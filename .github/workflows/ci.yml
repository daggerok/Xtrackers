name: Verify Xtrackers
on:
  pull_request:
  push:
    branches: [main, feat/xtrackers-etfs]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun build --target=bun scripts/update-data.ts --outfile=/dev/null
      - run: bun build app.tsx --outfile=/dev/null
      - run: git diff --check
